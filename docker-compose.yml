name: superapp-signature-stamp-detection
x-pip-args: &pip-args
  PIP_PRIMARY_INDEX_URL: ${PIP_PRIMARY_INDEX_URL:-https://package-mirror.liara.ir/repository/pypi/simple}
  PIP_FALLBACK_INDEX_URL: ${PIP_FALLBACK_INDEX_URL:-https://mirror2.chabokan.net/pypi/simple/}
services:
  model-setup:
    build:
      context: .
      dockerfile: backend/Dockerfile.setup
      args: *pip-args
    image: superapp-mark-model-setup:local
    restart: "no"
    init: true
    environment:
      MODEL_DIR: /models
      HF_HOME: /models/.hf-cache
      HF_HUB_ETAG_TIMEOUT: ${HF_HUB_ETAG_TIMEOUT:-30}
      HF_HUB_DOWNLOAD_TIMEOUT: ${HF_HUB_DOWNLOAD_TIMEOUT:-300}
    volumes:
      - model_cache:/models
    cpus: ${SETUP_CPUS:-2.0}
    mem_limit: ${SETUP_MEMORY:-1g}
    pids_limit: 96
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        <<: *pip-args
        TORCH_CPU_INDEX_URL: ${TORCH_CPU_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: superapp-signature-stamp-api:local
    depends_on:
      model-setup: {condition: service_completed_successfully}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_TOKEN: ${API_TOKEN:-}
      MODEL_DIR: /models
      MODEL_REPO: ${MODEL_REPO:-bluecopa/rf-detr-stamp-signature-detector}
      MODEL_REVISION: ${MODEL_REVISION:-c59fd4f451b254501700a56c7769f1a3d788c753}
      MODEL_SHA256: ${MODEL_SHA256:-3a831ae093be64a01a4d9c635dc6071ad7c43c3e95c3da0b33a17351df1e7909}
      MODEL_FILENAME: ${MODEL_FILENAME:-checkpoint_best_ema.pth}
      CPU_THREADS: ${CPU_THREADS:-2}
      MAX_CONCURRENT_INFERENCE: ${MAX_CONCURRENT_INFERENCE:-1}
      MAX_QUEUE_WAIT_SECONDS: ${MAX_QUEUE_WAIT_SECONDS:-10}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-20000000}
      PREPROCESS_MAX_LONG_EDGE: ${PREPROCESS_MAX_LONG_EDGE:-2500}
      SCORE_THRESHOLD: ${SCORE_THRESHOLD:-0.5}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-12582912}
      OMP_NUM_THREADS: ${CPU_THREADS:-2}
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - model_cache:/models:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8006}:8000"
    cpus: ${API_CPUS:-2.0}
    mem_limit: ${API_MEMORY:-4g}
    pids_limit: 160
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5)"]
      start_period: 240s
      interval: 30s
      timeout: 8s
      retries: 3
  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY_URL: ${NPM_REGISTRY_URL:-https://package-mirror.liara.ir/repository/npm/}
    image: superapp-signature-stamp-ui:local
    restart: unless-stopped
    init: true
    depends_on:
      api: {condition: service_healthy}
    environment:
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "${UI_BIND_IP:-127.0.0.1}:${UI_PORT:-8087}:8080"
    cpus: ${UI_CPUS:-0.5}
    mem_limit: ${UI_MEMORY:-256m}
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=8m,uid=101,gid=101
      - /var/cache/nginx:rw,nosuid,size=16m,uid=101,gid=101
      - /var/run:rw,nosuid,size=4m,uid=101,gid=101
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  model_cache:
