deploy:
  stage: deploy
  before_script:
    - "command -v sshpass >/dev/null"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p "$SSH_PORT" "$VM_IPADDRESS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo $SSH_USER
    - sshpass -p "$SSH_PASS" scp -P "$SSH_PORT" "$ENV_FILE" "$SSH_USER@$VM_IPADDRESS:/home/deb/new-aiservices/signature-stamp-detection/.env"
    - sshpass -p "$SSH_PASS" ssh $SSH_USER@$VM_IPADDRESS -p ${SSH_PORT} "cd /home/deb/new-aiservices/signature-stamp-detection && git pull origin master && docker compose up --build -d"
  only:
    - master
  tags:
    - ai-services
    - shell
